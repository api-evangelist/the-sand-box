summary: >-
  The Sandbox Developers API is protected by an OAuth-based identity system. A developer is issued a
  client id and client secret out of band (by request and approval), runs a browser authorization
  flow against the user's Sandbox account, exchanges the resulting code for a token, and calls the
  REST API with a bearer token. The API returns 401 `unauthenticated` for an invalid or missing
  bearer token and 403 `unauthorized` for insufficient permissions, which confirms both a bearer
  scheme and a permission/scope model on the wire.
