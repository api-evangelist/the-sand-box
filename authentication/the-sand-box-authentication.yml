- id: bearer
  type: http
  scheme: bearer
  documented: true
  in: header
  evidence: >-
    API Reference status-code table, 401 `unauthenticated` - "Invalid or missing bearer token".
  note: >-
    The bearer token is the OAuth access token from the flow above; it is not a separately issued
