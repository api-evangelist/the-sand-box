authorization:
  model: permission-scoped bearer token
  failure_codes:
  - status: 401
    code: unauthenticated
    meaning: Invalid or missing bearer token
  - status: 403
    code: unauthorized
    meaning: Insufficient permissions
access_model:
  onboarding: request-and-approve
  steps:
  - Request access to the Developer API from the Developers HUB.
  - Wait for The Sandbox team to review and approve the request.
  - Receive API credentials (OAuth client id and client secret) from The Sandbox.
  source: https://developers.sandbox.game/getting-started/
  note: >-
    There is no self-serve key issuance. A developer account, a Sandbox user account and a GitHub
    account are the stated prerequisites (the GitHub account is needed to pull the Unity SDK from
    its Git URL).
transport_requirements:
- HTTPS is required for all requests.
- Store access tokens securely.
- Handle expiration and use refresh tokens.
- Scope tokens properly to limit access.
