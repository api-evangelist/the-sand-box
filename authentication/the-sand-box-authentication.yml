  record. The Handling Authentication page (https://developers.sandbox.game/api/authentication.html)
  and the Swagger playground (https://developers.sandbox.game/api/docs/) both returned HTTP 503 from
  nginx on 2026-08-30, so the authoritative auth reference could not be captured. Everything below
  comes from pages that DID load; nothing here is inferred beyond what those pages state.
schemes:
