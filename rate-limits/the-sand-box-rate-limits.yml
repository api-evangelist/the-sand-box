summary: >-
  One published limit and no runtime signal. The Sandbox documents an average of 3 requests per
  second per integration with short bursts allowed, and a 429 carrying a `rate_limited` error code.
  It documents no rate-limit response headers at all, so a client cannot read its remaining budget
  or a retry delay off the wire.
