gaps:
- Field-level schemas for every entity are unpublished.
- >-
  The write surface is invisible. The API documents POST, PATCH and DELETE but the SDK exposes only
  reads, so which entities are writable, and by what operation, cannot be derived.
- >-
  On-chain identity (LAND token id, ASSET token id, wallet address) is not reconciled with the
  API's UUIDv4 ids anywhere in the published documentation, so an integrator cannot join API
  resources to their Ethereum/Polygon counterparts from the docs alone.
