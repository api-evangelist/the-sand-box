method: searched
source: >-
  Registry sweeps of npm (registry.npmjs.org package metadata), plus the provider's own Developers
  HUB (https://developers.sandbox.game/unity/getting-started/) and the thesandboxgame GitHub
  organization (https://api.github.com/orgs/thesandboxgame/repos).
summary:
  first_party_sdk_count: 1
  first_party_package_count: 9
  third_party_package_count: 0
  note: >-
    Two distinct distribution stories. (1) The Developer SDK for Unity is a REAL first-party client
    library for the Developers API, but it is NOT published to any package registry - The Sandbox
    ships it as a Unity Package Manager Git dependency pointed at a redistribution repo, so it has
    no registry metadata endpoint and no semver tag on GitHub. Its version is read from the
    provider's own changelog page instead. (2) Eight npm packages under the @sandbox-smart-contracts
    scope are first-party publications of The Sandbox's on-chain contracts; they are Solidity
    libraries, not clients for the REST API, and every one of them last published in 2023 or 2024.
    A JavaScript SDK is announced as planned and does not exist yet.
packages:
- language: csharp
  registry: git
  name: Sandbox Developer SDK for Unity
  url: https://developers.sandbox.game/unity/
  install: >-
    Unity Editor > Window > Package Manager > + > Add package from Git URL:
    git@github.com:thesandboxgame/tsb-developers-sdk-unity-redist.git
  repository: https://github.com/thesandboxgame/tsb-developers-sdk-unity-redist
  official: true
  version: 1.1.0
  published: null
  version_source: https://developers.sandbox.game/unity/changelog/
  note: >-
    version 1.1.0 is the newest heading in the provider's published SDK changelog. `published:` is
    null because there is no dated release for it anywhere we can read: the redistribution repo has
    ZERO GitHub releases and ZERO tags (checked 2026-08-30 via the GitHub API), and a UPM Git
    dependency has no registry metadata endpoint. The repo's last push was 2025-07-03, and the
    sample path shipped in the docs still reads ".../Sandbox Developer SDK for Unity/1.0.1/...",
    one minor behind the changelog. A consumer adding this Git URL gets whatever is on `master`
    at the moment they add it - the distribution is unpinned and undated, so nobody downstream can
    tell what version they are running either.
  description: >-
    Official Unity client for The Sandbox Developers API. Handles OAuth authorization and token
    refresh, then exposes user, avatar, asset, collection, library, inventory, LAND, SAND balance
    and social (followers/follows) calls, plus runtime GLTF asset preload and instantiation.
    Targets Windows, macOS, WebGL, Android and iOS; async surface built on UniTask.
