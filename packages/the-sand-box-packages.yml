decay_signal:
  note: >-
    Every first-party npm package predates 2025. The newest is
    @sandbox-smart-contracts/dependency-operator-filter at 2024-04-22, and the newest package that
    is not a dependency shim is @sandbox-smart-contracts/land at 2024-01-25. The contracts monorepo
    itself is still active (last push 2026-08-25), so the packages have fallen behind the source,
    not the other way round: nine of the seventeen package directories in that repo
    (avatar, batch-transfers, faucets, game-passes, land-sale, oft-sand, sandbox-forwarder, deploy,
    example-hardhat) have never been published to npm at all.
