generated: '2026-08-30'
method: searched
source: >-
  https://developers.sandbox.game/api/ + https://developers.sandbox.game/unity/changelog/ +
  https://status.sandbox.game/ + https://docs.sandbox.game/en/about/terms-of-use-privacy-and-legal +
  live probes of developers.sandbox.game and api.sandbox.game on 2026-08-30
summary: >-
  A young developer program with a maintained SDK changelog, no API versioning policy, no deprecation
  policy, no SLA, and a status page that has been DELETED. During this pass the API half of the
  Developers HUB - the authentication reference, the integration examples and the Swagger playground -
  was returning HTTP 503 from nginx, which is itself the most important operational fact in this file.
versioning:
  scheme: unversioned-path
  notes: >-
    The documented base URL is https://developers.sandbox.game/api/ with no version segment and no
    version header. No API version identifier is published.
  policy_documented: false
deprecation:
  policy_documented: false
  sunset_header: false
  deprecated_operations: []
  notes: >-
    No deprecation or sunset policy (RFC 8594) is published, and no operation can be checked for
    `deprecated: true` because no OpenAPI could be read. NO `Deprecation` pointer is emitted.
status_page:
  url: https://status.sandbox.game/
  exists: false
  provider: Atlassian Statuspage
  probed:
  - url: https://status.sandbox.game/
    status: 200
    body_title: 'Statuspage - Statuspage deleted'
    body: >-
      "This Statuspage was deleted. Are you the owner? The Statuspage can still be recovered, but it
      will be permanently deleted soon."
    checked: '2026-08-30'
  - url: https://status.sandbox.game/api/v2/summary.json
    status: 200
    result: not-json (returns the same deleted-page HTML)
    checked: '2026-08-30'
  notes: >-
    The hostname still resolves and still answers 200, which is exactly the failure mode the pointer
    grading exists to catch: a naive check sees 200 and credits a status page. There is no status
    page. NO `StatusPage` pointer is emitted.
availability_observed:
  window: '2026-08-30'
  finding: >-
    Every path under https://developers.sandbox.game/api/ except the API Reference index itself
    returned an nginx "503 Service Temporarily Unavailable" HTML page. That includes the two pages a
    developer needs most - Handling Authentication and Integration Examples - and the Swagger
    playground, which is the provider's only machine-readable contract surface.
  probed:
  - url: https://developers.sandbox.game/api/
    status: 200
  - url: https://developers.sandbox.game/api/index.html
    status: 503
  - url: https://developers.sandbox.game/api/authentication.html
    status: 503
  - url: https://developers.sandbox.game/api/examples.html
    status: 503
  - url: https://developers.sandbox.game/api/api-playground.html
    status: 503
  - url: https://developers.sandbox.game/api/docs/
    status: 503
  - url: https://developers.sandbox.game/getting-started.html
    status: 200
  - url: https://developers.sandbox.game/what-is.html
    status: 200
  - url: https://developers.sandbox.game/unity/
    status: 200
  - url: https://api.sandbox.game/health
    status: 200
    body: '{"required":"ready","optional":"ready"}'
  note: >-
    The static half of the site (home, what-is, getting-started, the whole Unity SDK section) is
    healthy, and the separate platform host api.sandbox.game reports itself ready. The outage is
    scoped to the /api/* route on the Developers HUB. It is recorded here as observed on one date,
    not asserted as permanent.
