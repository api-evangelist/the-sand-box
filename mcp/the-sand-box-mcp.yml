  finding: 17 public repositories, none an MCP server. Checked 2026-08-30 via the GitHub API.
- surface: npm registry
  finding: No MCP package under any sandbox.game-related name or the @sandbox-smart-contracts scope.
- surface: https://docs.sandbox.game/en/llms.txt
  finding: >-
    A real llms.txt is served (captured in llms/) but it is a documentation index for players and
