apis:
- aid: the-sand-box-developers-api
  name: The Sandbox Developers API
  description: >-
    The Sandbox Developers API is the REST surface of The Sandbox Developers HUB. It exposes core
    ecosystem data behind an OAuth-based identity system - Sandbox user identity, avatars, assets,
    collections, libraries, inventory, LAND ownership and SAND balances - so games, tools, dashboards
    and analytics platforms can integrate with The Sandbox metaverse. Requests are JSON over HTTPS
    using GET, POST, PATCH and DELETE, top-level resources carry a UUIDv4 id, property names are
    snake_case and timestamps are ISO 8601. Access is granted by request and approval; credentials
    are issued by The Sandbox as an OAuth client id and client secret.
  humanURL: https://developers.sandbox.game/api/
  baseURL: https://developers.sandbox.game/api/
