aid: the-sand-box
name: The Sandbox
description: >-
  The Sandbox is a user-generated-content metaverse and voxel gaming platform operated by TSB Gaming
  Ltd (a subsidiary of Animoca Brands), where players and creators build, own and monetise voxel
  games and assets on Ethereum and Polygon using the SAND token, LAND parcels and ERC-721/ERC-1155
  ASSETs. Its creator toolchain is VoxEdit (NFT and avatar designer) and Game Maker (experience
  designer), with a marketplace for trading assets. For developers The Sandbox runs a Developers HUB
  publishing a REST API for identity, avatars, assets, collections, libraries and LAND ownership, an
  OAuth-based identity system, a Swagger playground, and a Developer SDK for Unity distributed as a
  Unity Package Manager Git dependency. It also publishes its smart-contract source and a set of
  first-party npm packages under the @sandbox-smart-contracts scope.
